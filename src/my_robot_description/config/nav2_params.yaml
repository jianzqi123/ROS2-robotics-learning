# Nav2 参数 —— 针对本机器人和本房间推出来的, 不是抄的默认值。
#
# 三个贯穿全文的常数, 都有出处:
#
#   robot_radius = 0.25 m
#       底盘 0.4 x 0.3 的角点: sqrt(0.20^2 + 0.15^2) = 0.250。
#       轮子外缘 sqrt(0.05^2+0.20^2)=0.206, 万向轮尖端 0.20, 都更小,
#       所以角点就是外接圆半径。用圆形近似而不是多边形足迹:
#       差速车原地转弯时多边形足迹会扫过一片区域, 圆形近似天然覆盖这一点。
#
#   inflation_radius = 0.30 m
#       这个值改过一次, 原因值得记下来 —— 原值 0.40 是照着"最窄通道是
#       wall_inner_a 西端到西墙的 1.0 m、中线余量 0.50"推的, 而那个前提是错的:
#       用距离变换把整个世界扫一遍(map_slice_check.py --clearance)才发现,
#       真正卡人的是西墙(x=-5.0)到 platform 西面(x=-4.1)的 0.90 m 缝,
#       中线余量只有 0.450。
#
#       零代价带宽 = 2 * (中线余量 - inflation_radius):
#           inflation 0.40 -> platform 缝只剩 0.10 m, 车必须压在 ±5cm 内
#           inflation 0.30 -> 0.30 m, 正常跟线就能待在里面
#       实测后果: 压测时车停在 (-4.49, 0.36), 距 platform 0.39m —— 差 1cm
#       就在带外, DWB 前推 1.7s(0.37m)的轨迹全部撞进 inscribed 区,
#       日志刷 "No valid trajectories out of 419!" 直到 patience 耗尽。
#       所以 419 条轨迹全灭不是 DWB 的毛病, 是膨胀半径把路堵死了。
#
#       还有一条 0.60m 的缝(西墙<->shelf, 中线余量 0.300), 但 shelf 北端到
#       北墙只有 0.20m, 车过不去, 那是个死胡同, 不构成通行约束 —— 所以
#       没有按它去压 inflation。
#       下限: 必须 > robot_radius 0.25, 否则连缓冲都没有了。
#
#       !! 0.30 这个新值尚未通过压测验证 !!
#       0.40 的缺陷是实证过的(419 条轨迹全灭), 但换成 0.30 之后唯一一次
#       压测跑崩了, 而且崩的方式和膨胀半径未必有关: 车最后卡在 table1
#       底下, /odom 漂到 (8.26, 6.72) —— 房间只有 x∈[-5,5] y∈[-4,4],
#       那个位置在房间外面, 是轮子长时间空转积分出来的。AMCL 的运动模型
#       跟着 odom 一起跑偏到 (-4.46,-2.88), 于是动作报"到达目标"而真实
#       位置差了 8.5m。成功的是 AMCL 的幻觉, 不是导航。
#       先后关系没有隔离清楚: 究竟是 0.30 让规划贴得太近导致卡住,
#       还是先有别的原因导致跑偏、卡住只是后果, 需要多跑几轮才能分开。
#       在此之前不要把 0.30 当成已验证的配置。
#
#   laser 有效距离 0.3 ~ 12.0 m
#       0.3 是传感器 <range><min>; 12.0 略小于房间对角线 12.81 m ——
#       再远没有任何东西, 只会浪费 AMCL 的射线预算。
#       注意传感器标称量程是 30 m, 那个数在这个房间里没有意义。

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # 里程计噪声。teleport_test.py 实测净位移误差 1.08%、航向误差 0.15%,
    # 比 0.2 的默认值干净得多, 收紧到 0.1 可以让滤波器更信任 odom。
    # 但 README 记录过撞墙时轮子空转 —— 那种时刻 odom 会瞬间失真,
    # 太紧的 alpha 会让滤波器拒绝修正。0.1 是两者之间的折中。
    alpha1: 0.1     # 旋转带来的旋转噪声
    alpha2: 0.1     # 平移带来的旋转噪声
    alpha3: 0.1     # 平移带来的平移噪声
    alpha4: 0.1     # 旋转带来的平移噪声
    alpha5: 0.1

    laser_min_range: 0.3
    laser_max_range: 12.0
    max_beams: 60          # 360 线里取 60, 够用且省 CPU
    laser_model_type: "likelihood_field"
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    transform_tolerance: 1.0
    update_min_a: 0.2      # 转 0.2 rad 更新一次
    update_min_d: 0.25     # 走 0.25 m 更新一次
    save_pose_rate: 0.5
    tf_broadcast: true
    set_initial_pose: true
    # 机器人在 gazebo.launch.py 里就是从原点出生的, 直接给初值,
    # 省掉每次都要在 RViz 里点 2D Pose Estimate。
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "my_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.196
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25          # = robot_radius, 目标点差一个身位就算到
      use_astar: false
      allow_unknown: false     # 地图里的未知区域(物体内部)不许穿

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 取值依据: 原地旋转的平移量是零, 而差速车改变行进方向必须先掉头。
      # 180 度掉头在 max_vel_theta=1.0、acc_lim_theta=2.0 下理论 3.6s,
      # 叠加 RotateToGoal 的 slowing_factor=5.0 实际要 7s 上下。
      # 原值 0.5m/10s 意味着一次掉头就吃掉大半个时间窗, 剩下时间走不完 0.5m。
      # 改成"至少挪动自身半径"(0.25m), 时间窗 = 最坏掉头 7s +
      # 半速 0.11m/s 走完 0.25m 的 2.3s ≈ 9.3s, 留余量取 15s。
      #
      # 诚实记录: 这个改动是为了解释"通道被封后目标被 abort"而做的,
      # 但改完重跑, 故障一模一样(恢复 15 次、卡在 x≈-1.5)。日志里失败
      # 间隔确实从 ~11s 变成 ~17s, 说明参数生效了 —— 只是车根本没在动,
      # 不是动得慢。所以那个假设是错的, 本项并不是该故障的原因。
      # 保留新值只是因为上面那条推导本身站得住(掉头不产生位移),
      # 属于防御性取值, 不要把它当成已修复的证据。故障仍然开着。
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # 速度上限沿用 DWB 时期的推导: README 记录过 2.53m/s 下轮子打滑
      # 会让 odom 一秒漂 2.5m, 手动建图实测 0.19m/s 稳定, 这里留余量。
      desired_linear_vel: 0.22
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      # 前视距离。纯追踪会切内角, 切入量量级是 L/2。
      # 场地最窄可通行缝是西墙到 platform 的 0.90m, 半宽 0.45,
      # 减去车外接半径 0.25 只剩 0.20m 余量 —— 所以 L 必须压住:
      #   L=0.33 -> 最坏切入约 0.17m, 还在 0.20m 之内
      # 按速度缩放: 0.22 m/s * 1.5 s = 0.33m, 再夹到 [0.30, 0.60]。
      # 下限 0.30 略大于车半径; 再小纯追踪会开始左右摆。
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      lookahead_dist: 0.33
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.60

      # 按曲率减速: 转弯半径小于 0.90m 时降速。
      # !! regulated_linear_scaling_min_speed 官方默认是 0.25, 比本车的
      #    上限 0.22 还高 —— 照抄默认值等于这项功能完全不起作用。
      #    取 0.08 (约 desired 的 1/3)。
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.08

      # 按代价减速: 贴近障碍物时降速, 正好对冲实测只剩 2.0cm 余量的问题。
      # cost_scaling_dist 取 0.30 = 本项目的 inflation_radius;
      # inflation_cost_scaling_factor 必须等于代价地图里的
      # cost_scaling_factor(3.0), 不一致会把代价换算成错误的速度。
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      # 差速车: 与前视点夹角超过 45 度时先原地转到位再走。
      # 注意这与 DWB 的毛病不同 —— 这是有界的一次性旋转,
      # 转到阈值内就结束, 不会像 PathAlign 那样持续奖励旋转。
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0     # = max_vel_theta
      max_angular_accel: 2.0                 # = acc_lim_theta

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2

      # NavFn 不产生带尖点的倒车路径, 所以关掉。
      # (DWB 时期靠 min_vel_x=-0.10 拿到的倒车能力在 RPP 里是另一套机制。)
      allow_reversing: false

    # ------------------------------------------------------------------
    # 以下是之前用的 DWB, 已停用但完整保留 —— 里面的注释记录了一次
    # 有价值的失败调查, 而且要切回去只需把这里改名成 FollowPath、
    # 把上面的 RPP 段改成别的名字。
    #
    # 为什么换掉它: 封路后绕行时 DWB 选中的轨迹 vx 均值是 0.000(纯旋转),
    # 读 /evaluation 发现是 PathAlign 单独在惩罚快轨迹(+2.77, 其余全 0)。
    # PathAlign 衡量车头前方一点与路径的对齐度, 车头稍偏则任何前进都让
    # 该点更偏, 而原地旋转能"免费"改善对齐。降它的权重能改善机理指标
    # 却让端到端结果更差(BaseObstacle 顶上来)。这是结构问题, 不是调参问题。
    # RPP 没有这类评价函数 —— 它直接追踪路径上的前视点。
    FollowPath_dwb_disabled:
      plugin: "dwb_core::DWBLocalPlanner"

      # 速度上限 0.22 m/s: README 记录过 2.53 m/s 下轮子打滑
      # 会让 odom 在一秒内漂 2.5 m, 远超扫描匹配的搜索窗口。
      # 手动建图实测 0.19 m/s 稳定, 这里留一点余量。
      max_vel_x: 0.22
      # 允许倒车。默认 0.0 等于禁止倒车, 而实测两次卡死都发生在
      # wall_inner_a 的端头(东端 x=-1.0 附近、西端 x=-4.0 处) ——
      # 差速车绕紧角常需先退一点再转, 不能退就只能原地转,
      # 原地转不产生位移, 于是 SimpleProgressChecker 判定"没有进展"。
      # 这台车能这么设是因为雷达是 360 度的, 车后方是看得见的;
      # 只有前向传感器的机器人不该开倒车。
      # 幅度取 -0.10 而不是 -0.22: 倒车只用于脱困, 不该成为常规走法。
      #
      # 实测(nav2_test.py --only stress, 每次都在验证过干净的环境里跑):
      #   inflation 0.40 + 禁止倒车 -> 6 段到 5 段, 穿越 3 次, 恢复 34 次
      #   inflation 0.30 + 禁止倒车 -> 6 段到 5 段, 穿越 3 次, 恢复 14 次
      #   inflation 0.30 + 允许倒车 -> 6 段全到, 穿越 5 次, 恢复 5 次
      # 前两种配置下都失败的那一段(斜切向北, 卡在 wall_inner_a 西端)
      # 开放倒车后误差 0.082m 正常通过。恢复行为 34 -> 14 -> 5。
      min_vel_x: -0.10
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_speed_xy: 0.22
      min_speed_xy: 0.0
      max_vel_theta: 1.0
      min_speed_theta: 0.0

      # 加速度上限刻意压到 1.0 (默认 2.5)。
      # 底盘俯仰行程是 +-1.337 度(万向轮间隙 3.5mm / 力臂 0.15m),
      # 加速时车会后仰到后万向轮, 光束世界仰角变成 +1.000+1.337 = +2.337 度,
      # 从 0.1878m 高处越过 0.25m 障碍的距离只有 1.52m ——
      # 也就是说急加速会让 /scan 暂时看不见矮障碍物。
      # 压低加速度直接压低这个仰角, 是本项目特有的约束, 不要照抄默认值。
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05      # = 地图分辨率
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 3x3 m 滚动窗口: 房间才 10x8, 再大没意义;
      # 半径 1.5m 远大于 0.22m/s 下 1.7s 的仿真轨迹长度(0.37m), 够用。
      width: 3
      height: 3
      resolution: 0.05          # 与地图一致, 避免重采样
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.3
          obstacle_max_range: 10.0
          obstacle_min_range: 0.3

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.3
          obstacle_max_range: 10.0
          obstacle_min_range: 0.3

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

